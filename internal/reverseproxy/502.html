<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>502 — Сервис недоступен</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Share Tech Mono', monospace;
    line-height: 1.6;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* тонкая сетка фона — из общего стиля фронтенда */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 75%);
    opacity:0.6;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
    padding: 48px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: #ff6b5a;
    background: rgba(255, 107, 90, 0.08);
    border: 1px solid rgba(255, 107, 90, 0.3);
    padding: 6px 14px 6px 10px;
    border-radius: 999px;
    margin-bottom:36px;
  }

  .status .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background: #ff6b5a;
    box-shadow: 0 0 0 0 rgba(255,107,90,0.6);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse{
    0%   { box-shadow: 0 0 0 0 rgba(255,107,90,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(255,107,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,107,90,0); }
  }

  .code{
    font-weight:400;
    font-size: clamp(72px, 16vw, 128px);
    line-height:1;
    letter-spacing:-0.02em;
    color: #ffffff;
    position:relative;
    margin-bottom:6px;
  }

  .code span{
    color: #ff6b5a;
  }

  .title{
    font-size: clamp(18px, 3vw, 22px);
    font-weight:400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom:14px;
  }

  .illustration{
    width:100%;
    max-width:280px;
    margin: 32px 0 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    filter: grayscale(1) contrast(1.05) brightness(0.9);
  }

  .illustration img{
    width:100%;
    height:auto;
    display:block;
    filter: drop-shadow(0 12px 32px rgba(0,0,0,0.6));
  }

  .description{
    font-size:15px;
    line-height:1.6;
    color: #999;
    max-width:420px;
    margin-bottom:36px;
  }

  .description b{
    color: #e0e0e0;
    font-weight:600;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background: transparent;
    color: #c0c0c0;
    font-family: inherit;
    font-weight:400;
    font-size:14px;
    letter-spacing: 0.5px;
    text-transform: lowercase;
    padding: 10px 4px;
    border: none;
    border-bottom: 2px solid rgba(255, 255, 255, 0.15);
    text-decoration:none;
    cursor:pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .btn:hover{
    color: #ffffff;
    border-bottom-color: #ffffff;
  }

  .btn svg{ width:16px; height:16px; }

  .footnote{
    margin-top:28px;
    font-size:11px;
    letter-spacing:0.04em;
    color: #555;
  }

  @media (prefers-reduced-motion: reduce){
    .status .dot{ animation:none; }
  }

  @media (max-width:480px){
    .wrap{ padding:32px 20px; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="status">
      <span class="dot"></span>
      Статус: сбой на сервере
    </div>

    <div class="code">5<span>0</span>2</div>
    <div class="title">Сервис временно недоступен</div>

    <div class="illustration">
      <img src="https://storage.yandexcloud.net/kuronami-images/500.jpg" alt="Иллюстрация">
    </div>

    <div class="description">
      Мы уже знаем о проблеме и работаем над её устранением.<br>
      Попробуйте <b>обновить страницу через пару минут</b> —<br>
      обычно это занимает немного времени.
    </div>

    <a href="https://www.kuronami.fun" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12l9-9 9 9"/>
        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
      </svg>
      На главную
    </a>

    <div class="footnote">ERROR_CODE: 502 · BAD_GATEWAY</div>

  </div>

</body>
</html>
