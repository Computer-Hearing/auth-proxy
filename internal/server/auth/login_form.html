<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AUTH-PROXY | Вход</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Share Tech Mono', monospace;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 32px 32px 28px;
      transition: border-color 0.2s;
    }
    .card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .prompt {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 4px;
      color: #666;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .prompt::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e0e0e0;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    h2 {
      margin: 0 0 24px;
      font-size: 19px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .error {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 0 0 20px;
      padding: 10px 12px;
      background: rgba(255, 107, 90, 0.08);
      border: 1px solid rgba(255, 107, 90, 0.3);
      color: #ff6b5a;
      font-size: 13px;
      line-height: 1.4;
    }

    .error::before {
      content: "✕";
      font-size: 11px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 18px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding: 8px 6px;
      color: #e0e0e0;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-bottom-color: #ffffff;
    }

    input::placeholder { color: #666; }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      color: #c0c0c0;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: lowercase;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    button:hover { color: #ffffff; border-bottom-color: #ffffff; }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
<div class="card">
  <p class="prompt">auth-proxy // secure session</p>
  <h2>Вход в систему</h2>

  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}

  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">

    <div class="field">
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" placeholder="username" required autofocus>
    </div>

    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit">Войти</button>
  </form>

  <div class="footer">
    <span>Входные данные выдает Администратор площадки</span>
    <span></span>
  </div>
</div>
</body>
</html>
