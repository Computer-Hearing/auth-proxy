<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AUTH-PROXY | Вход</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #12181f;
      --border: #232b33;
      --text: #d7dde3;
      --muted: #6b7684;
      --accent: #4fd1c5;
      --accent-dim: #2f7a72;
      --error: #ff6b6b;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      background-image:
              linear-gradient(var(--border) 1px, transparent 1px),
              linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: center;
      color: var(--text);
      font-family: "SFMono-Regular", "JetBrains Mono", Consolas, Menlo, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px 32px 28px;
      box-shadow: 0 0 0 1px rgba(79, 209, 197, 0.03), 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .prompt {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .prompt::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
    }

    h2 {
      margin: 0 0 24px;
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .error {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 0 0 20px;
      padding: 10px 12px;
      background: rgba(255, 107, 107, 0.08);
      border: 1px solid rgba(255, 107, 107, 0.25);
      border-radius: 4px;
      color: var(--error);
      font-size: 13px;
      line-height: 1.4;
    }

    .error::before {
      content: "✕";
      font-size: 11px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 18px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0a0e13;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.12);
    }

    input::placeholder { color: #3d4550; }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: #eafffb;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover { background: #368079; }
    button:active { transform: translateY(1px); }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
<div class="card">
  <p class="prompt">auth-proxy // secure session</p>
  <h2>Вход в систему</h2>

  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}

  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">

    <div class="field">
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" placeholder="username" required autofocus>
    </div>

    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit">Войти</button>
  </form>

  <div class="footer">
    <span>Входные данные выдает Администратор площадки</span>
    <span></span>
  </div>
</div>
</body>
</html>
