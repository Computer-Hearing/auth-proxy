# внешний адрес гейта - на него auth-сервис возвращает пользователя после логина/выхода
gateway:
  base_url: "http://localhost:5000"

# auth-сервис: порт слушателя и внешний адрес (для редиректов гейта на /login, /refresh).
# allow_origins: CORS-разрешённые origin фронтендов (точные scheme://host[:port], свои
# поддомены). Пусто = открыто (*), без Allow-Credentials; не пусто = только эти origin
# и Allow-Credentials: true (нужен общий jwt.cookie_domain для всех поддоменов).
auth:
  port: 6000
  base_url: "http://localhost:6000"
  allow_origins:
    - "http://localhost:3000"

roles:
  - "user"
  - "admin"
  - "superadmin"

routes:
  - prefix: "/**/*.js"
    target: "http://static_service:8084"
    auth_method: none
    strip_first_prefix: true

  # редирект-маршрут: вместо проксирования отвечаем 302 на target + путь запроса
  # с strip_first_prefix: true первый сегмент пути вырезается: /inference/api/v1 -> login_service/login/api/v1
  - prefix: "/inference"
    target: "http://login_service:8084/login"
    auth_method: none
    redirect: true
    strip_first_prefix: true

  # основной API: JWT-авторизация (по умолчанию), роль admin
  - prefix: "/api"
    target: "http://api_service:8085"
    auth_method: jwt
    required_roles: ["admin"]

  # MLflow через jwt2basic: браузер с JWT-куками логинится через гейт, а бэкенду
  # уходит Authorization: Basic base64(login:password) (считается при старте из users).
  # Формат basic здесь не используется намеренно: чтобы браузер не получил нативной
  # Basic-формы mlflow. Креды users должны совпадать с basic_auth.ini mlflow.
  - prefix: "/mlflow"
    target: "http://mlflow:5000"
    auth_method: jwt2basic
    required_roles: ["user"]

blacklist:
  - "10.0.0.0/8"

users:
  - id: 1
    login: "superadmin"
    password: "superadmin"
    email: "superadmin@example.com"
    full_name: "Superadmin"
    role: "superadmin"
