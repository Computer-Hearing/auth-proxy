version: "3.9"

services:
  auth-proxy:
    build:
      context: .
      args:
        VERSION: dev
    image: auth-proxy:dev
    environment:
      LOG_LEVEL: info
      YAML_CONFIG_PATH: /etc/auth-proxy/gateway.yaml
      ROUTES_FILE: /etc/auth-proxy/routes.yaml
    volumes:
      # Каталог, а не отдельный файл: routes.yaml переписывается атомарно
      # (tmp + rename), что не работает с single-file bind mount.
      - ./data:/etc/auth-proxy
    ports:
      - "5000:5000"   # gateway
    expose:
      - "7000"        # admin: только внутри сети
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - tool-net

networks:
  tool-net:
    external: true
