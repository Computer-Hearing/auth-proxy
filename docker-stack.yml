version: "3.9"

services:
  auth-proxy:
    image: impeaone/auth-proxy:latest
    environment:
      # Статический конфиг (порты, Authentik, путь к routes.yaml)
      YAML_CONFIG_PATH: /etc/auth-proxy/gateway.yaml
      # Динамический конфиг (роли + маршруты); переписывается админкой
      ROUTES_FILE: /etc/auth-proxy/routes.yaml
      LOG_LEVEL: info
    volumes:
      # Каталог, а не отдельный файл: routes.yaml переписывается атомарно
      - ./data:/etc/auth-proxy
    ports:
      - "5000:5000"  # gateway
    expose:
      - "7000"       # admin: только внутри сети
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
